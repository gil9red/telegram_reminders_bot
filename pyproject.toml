[project]
name = "telegram-reminders-bot"
version = "2026.4.15"
description = "Проект для напоминаний через бота телеграм"
requires-python = ">=3.10, <3.11"
dependencies = [
    "peewee==3.14.8",
    "python-telegram-bot==13.9",
    "setuptools<70",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]
